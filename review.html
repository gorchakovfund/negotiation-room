<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case Review — The Negotiation Room</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens.css">
  <style>
    .stage { max-width: 1000px; }
    .toc { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-2); padding: 0; list-style: none; margin: 0; }
    .toc a { display: block; padding: var(--space-3); border: 1px solid var(--line-strong); color: var(--text); text-decoration: none; font-size: .9375rem; }
    .toc a:hover { border-color: var(--accent); }
    .toc b { font-family: var(--font-mono); font-weight: 500; color: var(--accent); margin-right: var(--space-2); }
    .case { margin-top: var(--space-7); scroll-margin-top: var(--space-5); }
    .variants { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .variant { border: 1px solid var(--accent); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
    .variant__code { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .12em; color: var(--accent); }
    .variant h3 { font-size: 1.125rem; }
    .variant p { font-size: .9375rem; line-height: 1.5; }
    .case .parties__list { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
    .variant p span { display: block; font-family: var(--font-mono); font-size: .6875rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .status { font-family: var(--font-mono); font-size: .6875rem; letter-spacing: .12em; text-transform: uppercase; padding: 2px 8px; border: 1px solid var(--muted); color: var(--muted); }
    .status--validated { border-color: var(--accent); color: var(--accent); }
    @media print {
      body { background: #fff; color: #000; } body::before, .topbar, .toc-wrap { display: none; }
      .briefing, .party, .variant { background: #fff; border-color: #999; }
      .case { break-before: page; margin-top: 0; }
      .briefing__body, .party__row, .party__name { color: #000; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand"><span class="topbar__mark" aria-hidden="true">◆</span><span>Case review · organisers only</span></div>
    <div class="topbar__lang"><a class="lang" href="?lang=en" id="l-en">EN</a><a class="lang" href="?lang=ru" id="l-ru">RU</a><a class="lang" href="./" style="margin-left:12px">Open the site</a></div>
  </header>
  <main id="main" class="stage">
    <section class="screen">
      <p class="eyebrow">All situations and variants</p>
      <h1>Case review</h1>
      <p class="lead muted">Every case from <code>data/situations.json</code>, exactly as applicants will see it. Use this page to check content and balance. It is not linked from the applicant site, but it is publicly reachable.</p>
      <div class="toc-wrap"><ul class="toc" id="toc"></ul></div>
    </section>
    <div id="cases"></div>
  </main>
  <script type="module" src="js/review.js"></script>
</body>
</html>
